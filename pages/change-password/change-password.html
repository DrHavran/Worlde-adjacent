<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../theme.js"></script>
    <link rel="stylesheet" href="../../base.css">
    <link rel="stylesheet" href="change-password.css">
    <title>Change password</title>
</head>
<body>

    <a href="../profile/profile.html" class="back-link" title="Back to profile" aria-label="Back to profile">←</a>

    <div class="card">
        <h1>Change password</h1>

        <p id="info">Checking your session…</p>

        <form id="change-password-form" hidden>
            <label>
                <span>New password</span>
                <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
            </label>
            <label>
                <span>Confirm password</span>
                <input type="password" id="confirm-password" autocomplete="new-password" required minlength="6">
            </label>
            <button type="submit">Update password</button>
            <p id="error" class="error"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="change-password.js"></script>
</body>
</html>
