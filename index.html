<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#69a92b">
    <title>Worlde 360 · My games</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="ambient" aria-hidden="true"></div>
    <header class="dashboard-header">
        <a class="wordmark" href="./" aria-label="Worlde 360 home"><span class="brand-orb">W</span> WORLD<span>E</span><b>360</b></a>
        <div class="profile"><div><strong>Player 1</strong><span id="gamerscore">0 completed today</span></div><span class="avatar" aria-hidden="true">P1</span></div>
    </header>
    <main>
        <nav class="channels" aria-label="Game collections" id="channels"></nav>
        <section class="library" aria-label="Game library">
            <div class="library-heading"><span id="collection-label">YOUR GAME LIBRARY</span><span class="online"><i></i> Ready to play</span></div>
            <div class="stage" id="stage"><div id="tiles" class="tiles"></div><p id="loading" role="status">Opening your game library…</p></div>
            <div class="selection-details">
                <div class="selection-copy"><p class="eyebrow" id="game-category">MY GAMES</p><h1 id="game-name">Welcome back.</h1><p id="game-description">Choose a game and make it a daily ritual.</p></div>
                <div class="selection-actions"><a id="play-game" class="play-button" target="_blank" rel="noopener noreferrer"><span class="key key-a">A</span> Play game <span aria-hidden="true">↗</span></a><button id="complete-game" type="button"><span class="key key-y">Y</span><span id="completion-label">Mark complete</span></button></div>
            </div>
            <div class="shelf-controls"><span><b id="position">00</b><span id="total"> / 00</span></span><div class="progress-track"><span id="progress"></span></div><button id="previous" type="button" aria-label="Previous game">←</button><button id="next" type="button" aria-label="Next game">→</button></div>
        </section>
    </main>
    <footer><div class="controller-hints"><span><span class="key key-a">A</span> Select</span><span><span class="key key-b">B</span> All games</span><span class="keyboard-hint">← → Browse <span class="hint-divider">/</span> ↑ ↓ Collections</span></div><div class="footer-right"><button id="theme-toggle" type="button">White mode</button><time id="clock"></time><span class="console-orb" aria-hidden="true">✕</span></div></footer>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <script type="module" src="index.js"></script>
</body>
</html>
