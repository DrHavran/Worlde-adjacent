<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="Data/theme.js"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="images/icon.png" type="image/png">
    <title>Worlde adjacent games</title>
</head>
<body>

    <header class="page-header">
        <h1>Worlde adjacent games</h1>
        <div class="header-right">
            <button id="theme-toggle" type="button">White mode</button>
            <div id="user-area"></div>
        </div>
    </header>

    <main class="sections"></main>

    <dialog id="points-dialog">
        <form id="points-form">
            <h2 id="points-title"></h2>
            <label for="points-input" id="points-label">points</label>
            <input type="number" id="points-input" min="0" required>
            <div class="dialog-buttons">
                <button type="submit">Save</button>
                <button type="button" id="points-cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="friends-dialog">
        <h2>Friends — <span id="friends-game-title"></span></h2>
        <ol id="friends-list"></ol>
        <div class="dialog-buttons">
            <button type="button" id="friends-close">Close</button>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
