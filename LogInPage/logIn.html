<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="icon"
        href="https://instagram.fprg4-1.fna.fbcdn.net/v/t51.2885-19/356797343_266025052791994_3279393702243699207_n.jpg?stp=dst-jpg_s206x206_tt6&_nc_cat=103&_nc_map=urlgen_bucketless&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4zNTIuQzMifQ%3D%3D&_nc_ohc=vOgHFlj0FZgQ7kNvwEq-fSQ&_nc_oc=Adq56HOMnlhqtTb-AfTY3JJeTI5Z-LfPQ8uwzhAh7MjGwlAx9Z858LIgwIfGvlV7ypE&_nc_zt=24&_nc_ht=instagram.fprg4-1.fna&_nc_ss=7b6a8&oh=00_AQTlYXwyQKf9v2VhOBT-4I3sQi-UZkeHatfVJWio3dGXkg&oe=6AEC0275"
        type="image/x-icon"
    >

    <title>Log in</title>
    <script src="../Data/theme.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form id="login-form">
        <h1>Log in</h1>

        <label>
            <span>Email</span>
            <input type="email" id="email" autocomplete="email" required>
        </label>

        <label>
            <span>Password</span>
            <input type="password" id="password" autocomplete="current-password" required>
        </label>

        <button type="submit">Log in</button>
        <p id="error" class="error"></p>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
